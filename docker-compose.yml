services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD: shlink
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shlink -d shlink"]
      interval: 5s
      timeout: 5s
      retries: 20

  shlink:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shlink:shlink@postgres:5432/shlink?sslmode=disable
      LISTEN_ADDR: :8080
      DEFAULT_DOMAIN: s.example.com
      IS_HTTPS_ENABLED: "true"
      INITIAL_API_KEY: ${INITIAL_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GEOLITE2_CITY_DB_PATH: /data/GeoLite2-City.mmdb
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/rest/health | grep -q '\"status\":\"pass\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
